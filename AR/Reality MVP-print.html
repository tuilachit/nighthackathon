<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Reality MVP — Print</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #F8FAFC; --text: #0F172A; --muted: #64748B;
    --border: #E2E8F0; --primary: #2563EB; --success: #10B981;
    --warning: #F59E0B; --panel: #FFFFFF; --r: 8px;
  }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    background: #EEF2F7;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  * { box-sizing: border-box; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .noscroll::-webkit-scrollbar { display: none; }
  .noscroll { scrollbar-width: none; }

  /* ========== Print pages ========== */
  .page {
    width: 1280px;
    min-height: 800px;
    padding: 36px 48px 40px;
    background:
      radial-gradient(1200px 600px at 20% -10%, #E0E7FF 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 110%, #DBEAFE 0%, transparent 55%),
      #EEF2F7;
    page-break-after: always;
    break-after: page;
    page-break-inside: avoid;
    break-inside: avoid;
    display: flex;
    flex-direction: column;
  }
  .page:last-child { page-break-after: auto; break-after: auto; }

  .page-header {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 24px; margin-bottom: 24px; padding-bottom: 16px;
    border-bottom: 1px solid #CBD5E1;
  }
  .page-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: #475569; margin-bottom: 6px;
  }
  .page-title {
    font-size: 30px; font-weight: 700; letter-spacing: -0.5px;
    line-height: 1.15; margin: 0; color: #0F172A;
  }
  .page-sub {
    font-size: 14px; color: #475569; margin-top: 6px; max-width: 720px;
    line-height: 1.5;
  }
  .page-meta {
    text-align: right; flex-shrink: 0;
  }
  .page-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: #64748B; letter-spacing: 1px;
  }
  .page-brand {
    font-size: 13px; font-weight: 600; color: #0F172A;
    display: flex; align-items: center; gap: 6px; justify-content: flex-end;
    margin-top: 4px;
  }
  .brand-dot {
    width: 18px; height: 18px; border-radius: 5px;
    background: linear-gradient(135deg, #2563EB, #1E40AF);
    display: inline-flex; align-items: center; justify-content: center;
  }

  .stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    gap: 32px; padding: 16px 0;
  }

  /* ========== Cover page ========== */
  .cover {
    width: 1280px; min-height: 800px;
    padding: 60px 64px;
    background:
      radial-gradient(1200px 600px at 20% -10%, #E0E7FF 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 110%, #DBEAFE 0%, transparent 55%),
      #EEF2F7;
    page-break-after: always;
    break-after: page;
    display: grid; grid-template-columns: 1.1fr 0.9fr;
    gap: 48px; align-items: center;
  }
  .cover-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; color: #475569; letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 18px;
    display: flex; align-items: center; gap: 10px;
  }
  .cover-eyebrow::before {
    content: ''; width: 36px; height: 1px; background: #475569;
  }
  .cover h1 {
    font-size: 64px; font-weight: 700; letter-spacing: -2px;
    line-height: 1.02; margin: 0 0 24px; color: #0F172A;
  }
  .cover h1 .accent { color: #2563EB; }
  .cover-sub {
    font-size: 18px; line-height: 1.5; color: #334155;
    max-width: 520px; margin-bottom: 32px;
  }
  .cover-tags {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 36px;
  }
  .cover-tag {
    padding: 6px 12px; border-radius: 999px;
    background: #fff; border: 1px solid #E2E8F0;
    font-size: 12px; font-weight: 500; color: #334155;
    font-family: 'JetBrains Mono', monospace; letter-spacing: 0.3px;
  }
  .cover-meta {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 16px 32px; max-width: 480px;
    border-top: 1px solid #CBD5E1; padding-top: 20px;
  }
  .cover-meta-row .lbl {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: #64748B; letter-spacing: 1px; text-transform: uppercase;
    margin-bottom: 4px;
  }
  .cover-meta-row .val {
    font-size: 14px; font-weight: 500; color: #0F172A;
  }
  .cover-art {
    display: flex; justify-content: center; align-items: center;
    position: relative;
  }

  /* ========== Phone preview (static) ========== */
  .phone {
    width: 360px; height: 720px;
    border-radius: 44px; overflow: hidden;
    background: #F2F2F7; position: relative;
    box-shadow: 0 30px 60px rgba(15,23,42,0.14), 0 0 0 1px rgba(0,0,0,0.08);
    flex-shrink: 0;
  }
  .phone.dark { background: #0F172A; }
  .phone-island {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 32px; border-radius: 22px;
    background: #000; z-index: 50;
  }
  .phone-statusbar {
    position: absolute; top: 0; left: 0; right: 0; height: 50px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 24px 0; z-index: 20;
    font-size: 14px; font-weight: 600;
  }
  .phone.dark .phone-statusbar { color: #fff; }
  .phone-home {
    position: absolute; bottom: 0; left: 0; right: 0; height: 28px;
    display: flex; justify-content: center; align-items: flex-end;
    padding-bottom: 7px; z-index: 60;
  }
  .phone-home::after {
    content: ''; width: 124px; height: 4px; border-radius: 100px;
    background: rgba(0,0,0,0.25);
  }
  .phone.dark .phone-home::after { background: rgba(255,255,255,0.6); }
  .phone-content {
    position: absolute; inset: 0; overflow: hidden;
  }

  /* ========== Annotations beside the phone ========== */
  .notes {
    flex: 1; max-width: 480px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .note-card {
    background: #fff; border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px;
  }
  .note-card h3 {
    font-size: 13px; font-weight: 700; margin: 0 0 8px;
    color: #0F172A; letter-spacing: -0.1px;
    display: flex; align-items: center; gap: 8px;
  }
  .note-card h3 .num {
    width: 22px; height: 22px; border-radius: 6px;
    background: #EFF6FF; color: #2563EB;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
  }
  .note-card p {
    font-size: 13px; line-height: 1.55; color: #475569; margin: 0;
  }
  .note-list {
    display: flex; flex-direction: column; gap: 8px; margin-top: 4px;
  }
  .note-list li {
    font-size: 12.5px; line-height: 1.45; color: #475569;
    list-style: none; padding-left: 16px; position: relative;
  }
  .note-list li::before {
    content: ''; position: absolute; left: 0; top: 8px;
    width: 6px; height: 6px; border-radius: 3px; background: #2563EB;
  }

  /* ========== Final overview page ========== */
  .overview {
    width: 1280px; min-height: 800px;
    padding: 48px 56px;
    background:
      radial-gradient(1200px 600px at 20% -10%, #E0E7FF 0%, transparent 60%),
      #EEF2F7;
    display: flex; flex-direction: column;
  }
  .overview-grid {
    display: grid; grid-template-columns: repeat(5, 1fr);
    gap: 16px; margin-top: 24px; flex: 1;
  }
  .overview-cell {
    display: flex; flex-direction: column; gap: 10px; align-items: center;
  }
  .overview-phone {
    width: 200px; height: 410px;
    border-radius: 28px; overflow: hidden; position: relative;
    background: #F2F2F7;
    box-shadow: 0 14px 30px rgba(15,23,42,0.12), 0 0 0 1px rgba(0,0,0,0.06);
  }
  .overview-phone.dark { background: #0F172A; }
  .overview-phone-content {
    transform: scale(0.498); transform-origin: top left;
    width: 402px; height: 824px; position: absolute; top: 0; left: 0;
  }
  .overview-cell .lbl {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: #475569; letter-spacing: 1px; text-transform: uppercase;
  }
  .overview-cell .num {
    font-size: 13px; font-weight: 600; color: #0F172A;
  }

  @media print {
    @page { size: 1280px 800px; margin: 0; }
    body { background: white; }
    .page, .cover, .overview { page-break-after: always; break-after: page; }
    .page:last-child, .overview:last-child { page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

</body>
</html>
